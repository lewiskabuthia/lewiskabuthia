<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Name — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wipe"></div>
<div class="home">
  <div>
    <div class="brand">Your Name</div>
    <div class="tagline">Developer &amp; Designer — choose a category</div>
  </div>

  <div class="watch" id="watch" tabindex="0" role="group" aria-label="Portfolio menu watch. Use left and right arrow keys to choose a category, Enter to open it.">
    <img src="assets/watch.jpg" alt="Glowing green alien-tech watch dial" draggable="false">
    <button class="orb" data-i="0" aria-label="Projects"></button>
    <button class="orb" data-i="1" aria-label="About"></button>
    <button class="orb" data-i="2" aria-label="Skills"></button>
    <button class="orb" data-i="3" aria-label="Contact"></button>
    <button class="screen" id="screen" aria-label="Open selected category"></button>
  </div>

  <div class="label" aria-live="polite"><h1 id="cat">Projects</h1><p id="blurb">Things I have built</p></div>

  <div class="hint"><kbd>←</kbd> <kbd>→</kbd> to choose &nbsp;·&nbsp; tap the screen (or press <kbd>Enter</kbd>) to open</div>
  <div class="nav-btns"><button id="prev" aria-label="Previous">‹ Prev</button><button id="next" aria-label="Next">Next ›</button></div>
</div>
<script src="app.js"></script>
<script>
(function () {
  var idx = 0, locked = false;
  var watch = document.getElementById('watch'),
      screenBtn = document.getElementById('screen'),
      orbs = document.querySelectorAll('.orb'),
      cat = document.getElementById('cat'),
      blurb = document.getElementById('blurb');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render(dir) {
    orbs.forEach(function (o, n) { o.classList.toggle('active', n === idx); });
    cat.textContent = PAGES[idx].name; blurb.textContent = PAGES[idx].blurb;
    if (dir) {
      watch.classList.remove('turn-r', 'turn-l'); void watch.offsetWidth;
      watch.classList.add(dir > 0 ? 'turn-r' : 'turn-l');
      setTimeout(function () { watch.classList.remove('turn-r', 'turn-l'); }, 220);
    }
  }
  function move(d) {
    if (locked) return;
    idx = (idx + d + PAGES.length) % PAGES.length; sfx.scroll(); render(d);
  }
  function select(x, y) {
    if (locked) return; locked = true;
    watch.classList.remove('timeout-red');
    sfx.transform();
    var r = screenBtn.getBoundingClientRect();
    screenBtn.classList.add('flash'); watch.classList.add('flash-ring');
    var cx = x != null ? x : r.left + r.width / 2, cy = y != null ? y : r.top + r.height / 2;
    setTimeout(function () { goTo(PAGES[idx].href, cx, cy); }, 1250); // let the transform sound play before leaving
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); select(); }
  });
  screenBtn.addEventListener('click', function (e) { select(e.clientX, e.clientY); });
  orbs.forEach(function (o, n) {
    o.addEventListener('click', function () {
      if (n === idx) { select(); } else { var d = n - idx; idx = n; sfx.scroll(); render(d > 0 ? 1 : -1); }
    });
  });
  document.getElementById('prev').addEventListener('click', function () { move(-1); });
  document.getElementById('next').addEventListener('click', function () { move(1); });

  /* swipe on touch screens */
  var sx = null;
  watch.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  watch.addEventListener('touchend', function (e) {
    if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
  });

  /* red "time out" mode lasts exactly as long as the timeout sound */
  sfx.onTimeout(function (on) { watch.classList.toggle('timeout-red', on); });
  render(0);
  sfx.arrive();
})();
</script>
</body>
</html>
